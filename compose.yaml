services:
  netprobe:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PROMETHEUS_URL: "${PROMETHEUS_URL:?请在 .env 中设置 Prometheus 查询服务地址}"
      PROMETHEUS_TOKEN: "${PROMETHEUS_TOKEN:-}"
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # 自定义配置时启用：
    # volumes:
    #   - ./config/local.json:/app/config/local.json:ro
    # environment 中同时添加 NETPROBE_CONFIG: /app/config/local.json
